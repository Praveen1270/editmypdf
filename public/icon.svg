<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Monochrome Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="#000000" />
  
  <!-- Main Document Body with folded corner -->
  <g>
    <!-- Document base: width 240, height 320, centered at (256, 256) -->
    <!-- Bounds: X from 136 to 376, Y from 96 to 416 -->
    <!-- Fold cut: top-right corner from X: 304, Y: 96 to X: 376, Y: 168 -->
    <path d="M 160 96 
             L 304 96 
             L 376 168 
             L 376 392 
             A 24 24 0 0 1 352 416 
             L 160 416 
             A 24 24 0 0 1 136 392 
             L 136 120 
             A 24 24 0 0 1 160 96 Z" 
          fill="#FFFFFF" />
    
    <!-- Folded Flap in top right corner -->
    <path d="M 304 96 
             L 304 152 
             A 16 16 0 0 0 320 168 
             L 376 168 Z" 
          fill="#E8E6E2" />
    <path d="M 304 96 L 304 168 L 376 168" fill="none" stroke="#D6D3CF" stroke-width="2" />
  </g>

  <!-- Document Accent Lines & PDF Badge -->
  <!-- Monochrome PDF mark badge -->
  <rect x="176" y="220" width="160" height="44" rx="8" fill="#000000" />
  <text x="256" y="252" 
        font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" 
        font-size="22" 
        font-weight="800" 
        letter-spacing="2" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        dominant-baseline="middle">PDF</text>

  <!-- Document text representation lines -->
  <rect x="176" y="296" width="160" height="12" rx="6" fill="#D6D3CF" />
  <rect x="176" y="328" width="112" height="12" rx="6" fill="#D6D3CF" />
  <rect x="176" y="360" width="140" height="12" rx="6" fill="#E8E6E2" />
</svg>
