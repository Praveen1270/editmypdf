<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="100%" height="100%">
  <!-- Monochrome Icon Mark (width 48, height 48, offset at x=8, y=8) -->
  <g transform="translate(8, 8)">
    <rect width="48" height="48" rx="10" fill="#000000" />
    <!-- Mini Document with folded corner -->
    <path d="M 15 10 
             L 28 10 
             L 35 17 
             L 35 36 
             A 2 2 0 0 1 33 38 
             L 15 38 
             A 2 2 0 0 1 13 36 
             L 13 12 
             A 2 2 0 0 1 15 10 Z" 
          fill="#FFFFFF" />
    <path d="M 28 10 L 28 15 A 2 2 0 0 0 30 17 L 35 17 Z" fill="#E8E6E2" />
    <!-- PDF badge -->
    <rect x="16" y="21" width="16" height="6" rx="1.5" fill="#000000" />
    <text x="24" y="25.5" 
          font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" 
          font-size="4.2" 
          font-weight="900" 
          letter-spacing="0.5" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          dominant-baseline="middle">PDF</text>
    <!-- Document lines -->
    <rect x="16" y="30" width="16" height="1.5" rx="0.75" fill="#D6D3CF" />
    <rect x="16" y="33" width="10" height="1.5" rx="0.75" fill="#E8E6E2" />
  </g>
  
  <!-- Wordmark Text -->
  <text x="68" y="40" 
        font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="-0.5" 
        fill="#1C1915">PDF<tspan font-weight="600" fill="#52504E">Kit</tspan></text>
</svg>
